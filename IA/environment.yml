name: botellas

channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults

dependencies:
  - python=3.11

  # ── PyTorch con CUDA 12.1 (GTX 1650 / Turing sm_75, driver >= 525) ────────
  - pytorch::pytorch=2.3
  - pytorch::torchvision=0.18
  - pytorch::pytorch-cuda=12.1

  # ── Científico base ────────────────────────────────────────────────────────
  - numpy>=1.26,<2.0
  - pillow>=10.0
  - scipy
  - tqdm
  - pyyaml

  # ── OpenCV con GUI (para visualizar detecciones en desarrollo) ─────────────
  - conda-forge::opencv=4.9

  # ── PyPI ───────────────────────────────────────────────────────────────────
  - pip
  - pip:
      - ultralytics>=8.2      # entrenamiento YOLOv8 + exportación NCNN
      - fiftyone>=0.24        # descarga y gestión dataset COCO

# ─── Comandos rápidos ─────────────────────────────────────────────────────────
# Crear:    conda env create -f environment.yml
# Activar:  conda activate bottle_clf
# Verificar GPU:
#   python -c "import torch; print(torch.cuda.is_available(), torch.cuda.get_device_name(0))"