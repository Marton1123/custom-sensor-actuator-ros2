# Parámetros por defecto para stepper_control_pkg
# Sobreescribibles desde la línea de comandos o en el launch file.
# Referencia: ros2 param set /nodo_actuadores delay_pulso 0.001

nodo_sensores:
  ros__parameters:
    sample_rate: 10        # Hz — frecuencia de publicación de /estado_sensor
    sensor_pin: 0          # Canal ADC o pin BCM del sensor

nodo_actuadores:
  ros__parameters:
    gpio_chip: 4           # Índice del chip GPIO (/dev/gpiochip4 en RPi5 + Ubuntu 24.04)
    pin_step: 17           # Pin BCM → PUL+ del TB6600
    pin_dir: 27            # Pin BCM → DIR+ del TB6600

    # Resolución del motor (pasos por revolución incluyendo microstepping)
    # Ejemplos:
    #   200   → full-step     (sin microstepping)
    #   400   → 1/2 step
    #   800   → 1/4 step
    #   1600  → 1/8 step
    #   3200  → 1/16 step     ← valor por defecto (DIP switches TB6600)
    pasos_por_rev: 3200

    # Semi-ciclo del pulso STEP (segundos). Periodo completo = 2 × delay_pulso.
    # Cambiable en caliente sin recompilar:
    #   ros2 param set /nodo_actuadores delay_pulso 0.001
    #
    # Referencia de velocidades con pasos_por_rev=3200:
    #   delay_pulso=0.0005 →  1 ms/ciclo → 1000 pasos/s → ≈18.75 RPM
    #   delay_pulso=0.001  →  2 ms/ciclo →  500 pasos/s → ≈ 9.38 RPM
    #   delay_pulso=0.002  →  4 ms/ciclo →  250 pasos/s → ≈ 4.69 RPM
    delay_pulso: 0.0005
